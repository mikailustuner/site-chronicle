name: sitechronicle
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitechronicle
      POSTGRES_USER: sitechronicle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitechronicle -d sitechronicle"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: .
    image: sitechronicle:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 43180
      DATABASE_URL: postgres://sitechronicle:${POSTGRES_PASSWORD}@postgres:5432/sitechronicle
      ARTIFACTS_PATH: /data/artifacts
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      TRUST_PRIVATE_HTTP: ${TRUST_PRIVATE_HTTP:-false}
      ALLOW_PRIVATE_TARGETS: "false"
      REQUIRE_DOMAIN_VERIFICATION: ${REQUIRE_DOMAIN_VERIFICATION:-false}
      CHROME_PATH: ${CHROME_PATH:-}
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "${SITECHRONICLE_BIND_IP:-0.0.0.0}:${SITECHRONICLE_PORT:-43180}:43180"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:43180/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [backend, audit_egress]

  worker:
    build: .
    image: sitechronicle:local
    command: ["node", "apps/worker/dist/index.js"]
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sitechronicle:${POSTGRES_PASSWORD}@postgres:5432/sitechronicle
      ARTIFACTS_PATH: /data/artifacts
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      ALLOW_PRIVATE_TARGETS: "false"
      REQUIRE_DOMAIN_VERIFICATION: ${REQUIRE_DOMAIN_VERIFICATION:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      AUDIT_PROXY_BIND_HOST: 0.0.0.0
      AUDIT_PROXY_PORT: 43182
      AUDIT_PROXY_ADVERTISE_HOST: worker
      CHROME_PATH: ${CHROME_PATH:-}
      CRUX_API_KEY: ${CRUX_API_KEY:-}
      ZAP_API_URL: ${ZAP_API_URL:-}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/playwright-seccomp.json
      - apparmor:unconfined
    cap_drop: [ALL]
    networks: [backend, scanner_control, audit_egress]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITECHRONICLE_HOST: ${SITECHRONICLE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, edge]

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["security"]
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=false", "-config", "api.key=${ZAP_API_KEY}", "-config", "api.addrs.addr.name=worker", "-config", "api.addrs.addr.regex=false"]
    restart: unless-stopped
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:?set ZAP_API_KEY for security profile}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    networks: [scanner_control]

volumes:
  postgres_data:
  artifacts:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  scanner_control:
    internal: true
  edge:
  audit_egress:
